# Woe - Cloudflare Workers Configuration Example
# ===============================================
# This is an example configuration file for Woe deployment.
# Copy this file to wrangler.toml and modify the values according to your setup.
#
# Basic Configuration
# -------------------
name = "woe"  # Worker name (appears in Cloudflare dashboard)
main = "src/index.ts"  # Entry point for the Worker
upload_source_maps = false  # sourcemaps stay local build artifacts (they embed developer machine paths); never uploaded
compatibility_date = "2025-11-28"  # Workers compatibility date
workers_dev = false  # Set to true to enable *.workers.dev domain, false for custom domain only

# Static Assets Configuration
# ---------------------------
# Serves the built frontend files from the public directory
[assets]
directory = "./public"  # Directory containing built frontend files
binding = "ASSETS"  # Binding name used in Worker code to access assets

# D1 Database Configuration
# -------------------------
# IMPORTANT: You must create a D1 database in Cloudflare and replace database_id with your actual database ID
# Run: wrangler d1 create woe-db
[[d1_databases]]
binding = "DB"  # Binding name used in Worker code to access database
database_name = "woe-db"  # Display name in Cloudflare dashboard (can be customized)
database_id = "00000000-0000-0000-0000-000000000000"  # MUST REPLACE: a real UUID from `wrangler d1 create` / `wrangler d1 list`

# R2 Bucket Configuration
# -----------------------
# Used for storing application icons and other files
# Run: wrangler r2 bucket create woe-storage (bucket name can be customized)
[[r2_buckets]]
binding = "R2"  # Binding name used in Worker code to access R2 bucket
bucket_name = "woe-storage"  # R2 bucket name (can be customized)

# Workers Images Binding Configuration
# -----------------------------------
# Used for server-side image compression/transcoding before writing to R2
[images]
binding = "IMAGES"

# Plugin Job 队列（Webhooker 异步任务）
# ----------------------------------------
# 必须与推送队列**不同名**：Worker 的 queue() 按 batch.queue 精确分流，
# 同名会让一条消息同时命中两个分支（实际只会进入先判断的 plugin job 分支）。
# Run: wrangler queues create woe-plugin-jobs
[[queues.producers]]
binding = "PLUGIN_JOB_QUEUE"  # enqueue 侧 binding（consumer 不需要该 binding）
queue = "woe-plugin-jobs"

[[queues.consumers]]
queue = "woe-plugin-jobs"
# 一次只处理一个 job：单条任务最长 20s，批次过大会超出 Worker 时间预算
max_batch_size = 1
# 首次 + 2 次重试 = 3 次总尝试，与 src/services/pluginJobs/pluginRetryPolicy.ts
# 的 MAX_ATTEMPTS = 3 互指；改动任一处必须同步另一处
max_retries = 2
max_concurrency = 1

[durable_objects]
bindings = [
  { name = "MESSAGE_STREAM_HUB", class_name = "MessageStreamHubObject" }
]

[[migrations]]
tag = "v1_message_stream_hub"
new_sqlite_classes = ["MessageStreamHubObject"]

# Environment Variables
# ---------------------
[vars]
# Environment identifier: "development" or "production"
ENVIRONMENT = "development"

# Default administrator username for first-run bootstrap
DEFAULT_ADMIN_USER = "admin"
# DEFAULT_ADMIN_PASSWORD 不得放在 [vars] 中（明文密码会随配置泄露）。
# 部署时请使用强随机值执行：wrangler secret put DEFAULT_ADMIN_PASSWORD
# 服务端会拒绝已知弱值（password/admin/123456），弱口令无法触发初始化。
# 免费版无需 CPU 相关配置；密码哈希迭代数在 src/middleware/auth.ts（见 README 运行计划与限制）

# Whether to allow user registration via API
# Accepts boolean (true/false) or string "true" (case-insensitive); anything else disables registration (fail-closed)
# Set to false in production to control user creation
REGISTRATION = false

# Plugin secret 主密钥版本（仅元数据，正整数；默认 1）
# 主密钥本体不得放入 [vars]：部署时执行
#   openssl rand -base64 32 | npx wrangler secret put PLUGIN_SECRET_MASTER_KEY
# 换主密钥后必须提升此版本并让用户重新输入 secret 字段（旧密文不可解，
# 保留 `***` 占位会返回 secret-reentry-required）。
PLUGIN_SECRET_KEY_VERSION = "1"

# 队列名覆盖：仅当部署时自定义了队列名（与 [[queues.*]].queue 不一致）才需要设置。
# 默认值见 src/index.ts：PLUGIN_JOB_QUEUE_NAME="woe-plugin-jobs"、PUSH_QUEUE_NAME="woe-push-queue"。
# 改名却未设置对应变量时，消息会落进「未知队列」分支并直接 ack 丢弃。
# PLUGIN_JOB_QUEUE_NAME = "woe-plugin-jobs"
# PUSH_QUEUE_NAME = "woe-push-queue"

# Webhooker 出站策略放宽（部署级，重部署生效；design §4.2）
# ------------------------------------------------------------------
# 默认严格：仅 https 公网目标。仅字符串 "true"（大小写不敏感）会放行，
# `1` / `yes` / `on` 等其他值一律静默按 false 处理（fail-closed）。
# WEBHOOKER_ALLOW_HTTP = "true"
# 开启私网放行 = 部署者主动关闭对应 SSRF 防护（内网 Home Assistant/n8n 场景），仅在可信部署启用：
# WEBHOOKER_ALLOW_PRIVATE_NETWORK = "true"

# Route Configuration (Optional)
# ------------------------------
# Uncomment and modify if you want to use a custom domain
# [[routes]]
# pattern = "your-domain.com"  # Your custom domain
# custom_domain = true

# Observability Configuration (Optional)
# --------------------------------------
# Uncomment to enable logging and tracing
# [observability]
# [observability.logs]
# enabled = true
# head_sampling_rate = 1
# invocation_logs = true
# persist = true
# [observability.traces]
# enabled = true
# head_sampling_rate = 1
# persist = true

# SQL Migration Files (Already configured)
# ----------------------------------------
# Migration SQL files are automatically included in the Worker bundle
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Scheduled tasks for periodic cleanup and push reconciliation
[triggers]
crons = ["0 2 * * *"]  # Daily at 2:00 AM UTC - plugin log cleanup + plugin job cleanup (30d terminal / 24h pending -> dead) + push reconciliation (stale lease reclaim, fallback pump, terminal outbox retention)
