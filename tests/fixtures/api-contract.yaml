  /client/{id}:
    get:
      tags:
        - client
      summary: Get client by ID
      description: Get client token details. Read response returns an empty `token` string (show-once semantics).
      operationId: getClient
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - client
      summary: Update client
      description: >
        Update a client's name and Woe device fields. This endpoint never
        rotates or replaces the client token. A deviceUid that collides with
        another client of the same user returns 409 and leaves the original
        row unchanged. Unknown fields (including token and platform) are
        silently ignored. Non-object JSON bodies (arrays, scalars, or null)
        are rejected with 400 "Invalid JSON body".
        `expiresAfterInactivitySeconds` is persisted (Gotify v3 client inactivity
        expiry): the stored `expiresAt` is recomputed as
        `(lastUsed ?? createdAt) + seconds`; 0 means never expires; negative,
        non-integer, or values above 100 years are rejected with 400.
        Per upstream Gotify v3, the update response keeps the stored token
        value (for gtfy-issued clients this is the public lookup form, not a
        usable two-segment credential).
      operationId: updateClient
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Required non-empty string, stored verbatim (whitespace-only names allowed, Gotify binding:"required" parity, no trim).
                deviceUid:
                  type: string
                  nullable: true
                  description: 'Woe extension. Tri-state: string = update (trimmed; trimmed-empty is rejected with 400), null = clear, absent = unchanged. Any other JSON type (number/boolean/array/object) for this field returns 400. Unique per user; collision with another client of the same user returns 409.'
                deviceToken:
                  type: string
                  nullable: true
                  description: 'Woe extension. Tri-state: string = update (trimmed; trimmed-empty is rejected with 400), null = clear, absent = unchanged. Any other JSON type (number/boolean/array/object) for this field returns 400. Setting a value refreshes tokenUpdatedAt and recovers tokenStatus invalid/expired to active; inactive clients stay inactive. Clearing (null) or omitting the field leaves tokenStatus untouched; clearing also clears tokenUpdatedAt. Never rotates the client token itself.'
                expiresAfterInactivitySeconds:
                  type: integer
                  nullable: true
                  description: >-
                    Gotify v3 client inactivity expiry in seconds. Absent =
                    unchanged; null or 0 = never expires (stored `expiresAt`
                    cleared); positive = persisted and the stored `expiresAt`
                    is recomputed as `(lastUsed ?? createdAt) + seconds`.
                    Negative, non-integer, or values above 100 years are
                    rejected with 400.
      responses:
        '200':
          description: >-
            Client updated successfully. The response keeps the stored token
            value per upstream Gotify v3.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - client
      summary: Delete client
      description: >-
        Delete a client token. Dangerous endpoint: requires an elevated
        session (Basic auth, or a client token with an unexpired elevation
        from `POST /client/{id}/elevate`).
      operationId: deleteClient
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

