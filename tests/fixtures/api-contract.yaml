          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Plugin name updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /plugin/{id}/image:
    post:
      tags:
        - plugin
      summary: Upload plugin icon
      description: Upload plugin icon image
      operationId: uploadPluginIcon
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Icon uploaded successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - plugin
      summary: Delete plugin icon
      description: Delete plugin icon image
      operationId: deletePluginIcon
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
      responses:
        '200':
          description: Icon deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stream:
    get:
      tags:
        - stream
      summary: WebSocket stream
      description: >-
        WebSocket endpoint for real-time message streaming. Heartbeat: clients
        keep the connection alive with a text `ping` frame, answered
        automatically with a text `pong` (Workers platform cannot send
        protocol-level server pings; retained deviation). The text ping also refreshes
        client inactivity expiry (throttled, ~5 minutes).
      operationId: streamMessages
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '101':
          description: WebSocket connection established
        '200':
          description: Non-WebSocket request acknowledged
        '401':
          $ref: '#/components/responses/Unauthorized'

  /static/defaultapp.png:
    get:
      tags:
        - image
      summary: Default application image
      description: >-
        The real default-application PNG resource (Gotify-aligned), served at
        both the root path (`/static/defaultapp.png`) and the `/api/v1` entry
        (`/api/v1/static/defaultapp.png`). Routing is layered: in deployment
        the root entry is served directly by the platform assets layer
        whenever the bundled asset exists (Cloudflare assets-first routing;
        same PNG bytes, no Worker hop), so the Worker-validated route is the
        failure/absent-asset path for the root entry, while the `/api/v1`
        entry is always Worker-served, reading the bundled asset (identical
        to the upstream Gotify `static/defaultapp.png` copy) and validating
        PNG magic bytes at serve time. An SPA-HTML fallback, a missing asset,
        or a non-PNG payload on a Worker-served path results in an explicit
        error — never a masked success. The response value
        `image: "static/defaultapp.png"` is response-only and is never
        written to the database (an application without a custom image keeps
        `image` NULL in storage).
      operationId: getDefaultAppImage
      security: []
      responses:
        '200':
          description: Default application image (real PNG bytes)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '500':
          description: >-
            Bundled asset missing or failed PNG validation (explicit error;
            never SPA HTML).

  /image/{filename}:
    get:
      tags:
        - image
      summary: Get image
      description: >-
        Retrieve uploaded image resources from R2 storage. Serves media under
        both the legacy stored prefix (`/image/...`, `/api/v1/image/...`) and
        the response-contract relative form (`image/...`) — the key after the
        `/image/` prefix is resolved against R2 unchanged, so legacy stored
        keys keep working alongside the normalized response values.
      operationId: getImage
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Image filename (R2 key after the /image/ prefix)
          schema:
            type: string
      responses:
        '200':
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
              description: Non-GIF uploads are converted to WebP when the Images binding is enabled.
        '404':
          description: Image not found
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /gotifyinfo:
    get:
      tags: [system]
      summary: Get Gotify client capability information
      operationId: getGotifyInfo
      security: []
      responses:
        '200':
          description: Gotify capability information

  /client/{id}/elevate:
    post:
      tags: [client]
      summary: Elevate a client token
      operationId: elevateClient
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                durationSeconds:
                  type: integer
                  minimum: 1
      responses:
        '200': { description: Elevation result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /client/{id}/deactivate:
    post:
      tags: [client]
      summary: Deactivate push for a client
      operationId: deactivateClient
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Deactivation result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /message/count:
    get:
      tags: [message]
      summary: Count messages for the current user
      operationId: getMessageCount
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '200': { description: Message count }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugin/available:
    get:
      tags: [plugin]
      summary: List available plugin types
      operationId: getAvailablePlugins
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '200': { description: Available plugins }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /user/{id}/disabled:
    put:
      tags: [user]
      summary: Set user disabled state
      operationId: setUserDisabled
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200': { description: Updated user }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /message/{id}/jobs:
    get:
      tags: [message, plugin]
      summary: List plugin jobs for a message
      description: |
        Returns the authenticated user's plugin jobs for one message, newest
        first, at most 20 entries. `pluginId` is an optional positive integer
        filter. Jobs are listed regardless of how they were created (manual
        POST or plugin events such as Webhooker's `message.create` delivery);
        for event-only plugins this API is the read-only observation surface,
        failures are never retried from here. When the message row no longer
        exists but jobs remain, the response reports `messageDeleted: true`
        and returns the history for the job owner (`plugin_jobs.user_id`);
        non-owners receive 404. `result` is plugin-defined JSON treated as
        public data. `error` is populated only for `failed`/`dead` jobs;
        `pending` (including retry) and `success` report `null`. The response
        never includes the job payload, secrets, prompts, or message content.
      operationId: listMessageJobs
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - name: pluginId
          in: query
          required: false
          description: Optional positive integer plugin instance filter.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Message job history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [message, plugin]
      summary: Enqueue a plugin job for a message
      description: |
        Queues one plugin job for a message owned by the authenticated user.
        Application tokens are rejected; client token or Basic auth is
        required. Enqueue order is fixed: message ownership, plugin ownership,
        plugin enabled, plugin permission (`user_plugin_permissions`, admins
        exempt), `message` subject support, manual-trigger gate (tasks
        declaring `manualTrigger: false` — v1: `builtin/webhooker` — always
        get 409 `plugin-unavailable` here, before the pending check, so a
        pending job never turns the call into 202; such tasks are enqueued
        only by their own plugin events), existing `pending` job (returned
        as 202 without a quota check), quota check, config validation,
        optional payload snapshot preparation (`prepareJob`, which may reject
        the rendered target URL with 409 `outbound-blocked` when it violates
        the deployment outbound policy), then job insert and queue send. A
        successful enqueue returns exactly `{ jobId, status }` with HTTP 202.
        Errors: 404 when the message or plugin is missing/not owned, 409 when
        the plugin is disabled, not permitted for this user, does not support
        `message`, opts out of manual triggers, its configuration is invalid,
        its rendered outbound target is blocked by policy, or its stored
        secret is unavailable/corrupt, 429 when the daily quota is exhausted,
        and 503 when quota storage or the queue is unavailable. Concurrent
        requests hitting the pending-job unique index return the existing job
        instead of 500.
      operationId: enqueueMessageJob
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId]
              properties:
                pluginId:
                  type: integer
                  minimum: 1
                  description: Plugin instance owned by the authenticated user.
      responses:
        '202':
          description: Job accepted (or an existing pending job returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/quotas/{namespace}/users:
    get:
      tags: [admin, plugin]
      summary: List enabled AI task plugin quota rows
      description: |
        Admin only (Basic admin or admin client token; elevation is not
        required). v1 accepts only the `ai` namespace. Returns one row per
        enabled task plugin instance declaring the `ai` quota namespace with its default limit,
        per-user override (`null` when absent), effective limit, raw usage
        counters and `usageToday` computed for the current UTC day. KV or usage
        read failures return 503 for the whole response (no partial success).
        Secrets, prompts, message content and raw configuration are never
        returned.
      operationId: listAdminQuotas
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          description: Quota namespace (v1 only `ai`).
          schema:
            type: string
            enum: [ai]
      responses:
        '200':
          description: Quota rows for enabled AI task plugin instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/quotas/{namespace}/{userId}:
    put:
      tags: [admin, plugin]
      summary: Set or clear a user quota override
      description: |
        Admin only. v1 accepts only the `ai` namespace. `limit` must be a
        non-negative safe integer or `null`: a positive value sets the daily
        limit, `0` disables the user, and `null` deletes the override so the
        effective limit falls back to `system_state.ai_user_daily_limit`.
        The override is stored in `QUOTA_KV` under `ai:limit:<userId>`; storage
        failures return 503. User self-service is not supported.
      operationId: setAdminQuotaOverride
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          description: Quota namespace (v1 only `ai`).
          schema:
            type: string
            enum: [ai]
        - name: userId
          in: path
          required: true
          description: Target user ID (positive integer).
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaLimitUpdate'
      responses:
        '200':
          description: Override applied (empty object)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Basic authentication with username and password

    ClientToken:
      type: apiKey
      in: header
      name: X-Gotify-Key
      description: >-
        Client token for user operations. Newly issued tokens use the
        `gtfyc.<base64url>` EdDSA format (private form); legacy `C…` tokens
        remain valid.

    AppToken:
      type: apiKey
      in: header
      name: X-Gotify-Key
      description: >-
        Application token for sending messages. Newly issued tokens use the
        `gtfya.<base64url>` EdDSA format (private form); legacy `A…` tokens
        remain valid.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string

    ApplicationId:
      name: id
      in: path
      required: true
      description: Application ID
      schema:
        type: string

    ClientId:
      name: id
      in: path
      required: true
      description: Client ID
      schema:
        type: string

    MessageId:
      name: id
      in: path
      required: true
      description: Message ID
      schema:
        type: string

    PluginId:
      name: id
      in: path
      required: true
      description: Plugin ID
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of messages to return (1-200)
      schema:
        type: integer
        minimum: 1
        maximum: 200

    Since:
      name: since
      in: query
      description: Return messages since this ID
      schema:
        type: integer
        minimum: 0

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nickname:
          type: string
        email:
          type: string
        avatar:
          type: string
        description:
          type: string
        admin:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 creation timestamp (Gotify v3); `null` for legacy rows.

    CurrentUser:
      description: >-
        Gotify v3 CurrentUserExternal: the User shape plus session-scoped
        fields. `clientId` is present only when authenticated with a client
        token (omitted entirely for Basic auth, upstream
        `json:"clientId,omitempty"`). `elevatedUntil` is present only when
        client-authenticated AND the client's elevation is non-null and still
        in the future (omitted when expired, upstream
        `json:"elevatedUntil,omitempty"`).
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            clientId:
              type: integer
              description: The client id of the current session (client token auth only; omitted for Basic auth).
            elevatedUntil:
              type: string
              format: date-time
              description: The time until which the session is elevated (client token auth with unexpired elevation only).

    Application:
      type: object
      required:
        - id
        - name
        - sortKey
        - description
        - internal
        - image
      properties:
        id:
          type: integer
        token:
          type: string
          description: >-
            Endpoint-dependent (Gotify v3 show-once semantics with a Woe
            detail extension). `GET /application` and
            `GET /user/{id}/applications` omit the `token` key entirely
            (matching upstream `json:"token,omitempty"`; the key is absent,
            not an empty string). `GET /application/{id}` (Woe extension)
            returns the stored token value verbatim — a `gtfy…` public-form
            lookup value for enhanced-format applications (a public key, not
            a usable credential, used for local derivation-based validation)
            or the legacy plaintext token for legacy rows — with
            `Cache-Control: private, no-store` on the success response and a
            token-free 404 for unknown/non-owned ids. Newly issued `gtfy…`
            EdDSA private-form tokens are returned exactly once by
            `POST /application` and `PUT /application/{id}/security`; this
            show-once restriction does not apply to legacy plaintext
            credentials returned by the owner-scoped detail endpoint.
            `PUT /application/{id}` and
            `POST /application/{id}/image` write responses keep the stored
            (public-form) token value per upstream v3; `DELETE
            /application/{id}/image` still returns `""`. Consumers must not
            assume the key is always present or always a string. Legacy `A…`
            tokens remain valid for authentication.
        name:
          type: string
        sortKey:
          type: string
        description:
          type: string
        internal:
          type: boolean
        image:
          type: string
          description: >-
            Media path relative to the service base URL (no leading slash):
            `image/<key>` for applications with a custom image;
            `static/defaultapp.png` when there is no custom image (fetchable
            at `GET /static/defaultapp.png`, root and `/api/v1` entries).
            Response-only normalization: stored legacy values
            (`/api/v1/image/<key>`) and R2 keys are unchanged, and external
            full URLs / data URLs pass through verbatim.
        lastUsed:
          type: string
          format: date-time
          nullable: true
        defaultPriority:
          type: integer
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 creation timestamp (Gotify v3); `null` for legacy rows.

    ApplicationParams:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        defaultPriority:
          type: integer
        sortKey:
          type: string
          description: Optional stable sort key. When omitted, server generates one.

    Client:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
          description: >-
            Always `""` in read responses (Gotify v3 show-once semantics).
            The real token is returned exactly once by `POST /client` as a
            `gtfy…` EdDSA private-form token; `PUT /client/{id}` and
            `PUT /client/{id}/push-state` update responses keep the stored
            (public-form) token value per upstream v3. Legacy `C…` tokens
            remain valid for authentication.
        name:
          type: string
        platform:
          type: string
        deviceUid:
          type: string
          nullable: true
        deviceToken:
          type: string
          nullable: true
        tokenUpdatedAt:
          type: string
          format: date-time
          nullable: true
        tokenStatus:
          type: string
          enum: [active, inactive, invalid, expired]
          nullable: true
        appVersion:
          type: string
          nullable: true
        deviceModel:
          type: string
          nullable: true
        lastUsed:
          type: string
          format: date-time
          nullable: true
        elevatedUntil:
          type: string
          format: date-time
          nullable: true
          description: >-
            Elevation expiry from `POST /client/{id}/elevate`; required for
            admin endpoints and dangerous operations. An expired elevation
            (`now >= elevatedUntil`) is serialized as `null` (field kept),
            matching upstream gotify v3 `GetClients` semantics; applies to
            list, single-get and write responses alike.
        expiresAfterInactivitySeconds:
          type: integer
          description: >-
            Gotify v3 inactivity expiry window in seconds; 0 = never expires.
            The web frontend registers its own client with 604800 (a 7-day
            rolling inactivity window); that is a frontend policy, not an API
            default (clients created via the API still default to 0, never
            expires).
        expiresAt:
          type: string
          format: date-time
          description: >-
            Persisted inactivity expiry timestamp
            (`(lastUsed ?? createdAt) + expiresAfterInactivitySeconds`).
            Omitted when never expires (upstream `omitempty`). Authentication
            rejects the token once `now >= expiresAt`; expired clients are
            removed by the daily scheduled cleanup.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 creation timestamp (Gotify v3); `null` for legacy rows.

    Message:
      type: object
      properties:
        id:
          type: integer
        appid:
          type: integer
        message:
          type: string
        title:
          type: string
        priority:
          type: integer
        date:
          type: string
          format: date-time
        extras:
          type: object
          description: >-
            Additional data; optional. Valid top-level objects (including
            `{}` and objects containing nested arrays) are returned verbatim.
            Legacy stored values that are not valid objects (parse failures,
            top-level strings/numbers/booleans/arrays, JSON null) are omitted
            from the response rather than echoed — read-side normalization
            only; no data cleansing is performed on stored rows.

    PagedMessages:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    Paging:
      type: object
      properties:
        size:
          type: integer
        since:
          type: integer
          description: >-
            Continuation cursor (Gotify v3 semantics): the last message id of
            this page, returned only when another page exists. Terminal pages
            (including a last page that is exactly `limit` long) and empty
            pages return 0 and never echo the requested `since`.
        limit:
          type: integer
        next:
          type: string
          description: >-
            Relative path to the next page (Gotify v3), e.g.
            `/message?limit=100&since=23`. Present only when another page
            exists.

    PluginConf:
      type: object
      required:
        - id
        - name
        - token
        - modulePath
        - enabled
        - capabilities
      properties:
        id:
          type: integer
        name:
          type: string
        token:
          type: string
          description: Plugin token (`P…` format). Plugin tokens are exempt from Gotify v3 show-once semantics and keep being returned in read responses.
        modulePath:
          type: string
        enabled:
          type: boolean
        icon:
          type: string
        capabilities:
          type: array
          items:
            type: string
        author:
          type: string
        license:
          type: string
        website:
          type: string
        configExample:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 creation timestamp (Gotify v3); `null` for legacy rows.

    Health:
      type: object
      properties:
        health:
          type: string
          enum: [green, red]
        database:
          type: string
          enum: [green, red]

    VersionInfo:
      type: object
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
          format: date-time
          description: Build-time timestamp generated before dev/deploy starts.

    SystemStatus:
      type: object
      properties:
        initialized:
          type: boolean
        version:
          type: string
        health:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errorCode:
          type: integer
        errorDescription:
          type: string

    MessageJobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: integer
        status:
          type: string
          enum: [pending]

    MessageJobError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Closed plugin job error code. `provider-*` codes refer to the
            downstream service (AI provider or webhook target alike);
            `invalid-existing-tags` and `invalid-output` are plugin-defined
            semantics passed through uninterpreted.
          enum:
            - config
            - secret-decrypt-failed
            - not-found
            - invalid-existing-tags
            - provider-auth
            - provider-quota
            - provider-rate-limit
            - provider-model
            - provider-timeout
            - provider-network
            - provider-invalid-envelope
            - invalid-output
            - outbound-blocked
            - downstream-rejected
            - limit-exceeded
            - quota-read-failed
            - dead-timeout
            - enqueue-send-failed
            - write-failed
            - plugin-unavailable
            - internal
        message:
          type: string
          description: Fixed, non-sensitive error message.

    MessageJob:
      type: object
      required: [jobId, pluginId, status, result, error, createdAt, completedAt]
      properties:
        jobId:
          type: integer
        pluginId:
          type: integer
        status:
          type: string
          enum: [pending, success, failed, dead]
        result:
          nullable: true
          description: Plugin-defined JSON result (public data); `null` when absent or unparseable.
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MessageJobError'
          description: Populated only for terminal `failed`/`dead`; `null` otherwise.
        createdAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Terminal completion time; `null` while pending.

    MessageJobList:
      type: object
      required: [messageDeleted, jobs]
      properties:
        messageDeleted:
          type: boolean
          description: True when the message row no longer exists and jobs are returned as owner history.
        jobs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MessageJob'

    QuotaUser:
      type: object
      required:
        - userId
        - pluginId
        - defaultLimit
        - overrideLimit
        - effectiveLimit
        - usageDay
        - usageCount
        - usageToday
        - source
      properties:
        userId:
          type: integer
        pluginId:
          type: integer
        defaultLimit:
          type: integer
        overrideLimit:
          type: integer
          nullable: true
        effectiveLimit:
          type: integer
        usageDay:
          type: string
          nullable: true
        usageCount:
          type: integer
        usageToday:
          type: integer
        source:
          type: string
          enum: [default, override]

    QuotaUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/QuotaUser'

    QuotaLimitUpdate:
      type: object
      required: [limit]
      properties:
        limit:
          type: integer
          minimum: 0
          nullable: true
          description: Non-negative integer sets the limit (`0` disables); `null` clears the override.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
