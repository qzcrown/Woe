openapi: 3.0.3
info:
  title: Woe API
  description: |
    Gotify-compatible notification service running on Cloudflare Workers.

    ## Authentication

    The API supports two types of authentication:

    1. **Basic Authentication** - Username and password (for user authentication)
    2. **Token Authentication** - Using `X-Gotify-Key` header with:
       - **Client Token** - For user-facing operations (read messages, manage resources)
       - **Application Token** - Used by `POST /message` (the endpoint also accepts client-token and Basic authentication)

    An `Authorization: Bearer <token>` header is also accepted (the scheme name
    is matched case-insensitively; the token itself is never trimmed). Retained
    deviation: a recognized Bearer scheme with an explicitly empty token counts
    as submitted credentials and is rejected with 401 instead of falling back
    to anonymous access. On the wire, the server keeps the scheme and token distinction exposed by the
    runtime; an explicitly empty recognized Bearer token is rejected with 401.
    Runtime-specific header whitespace normalization must be verified separately.

    ## Authorization Levels

    - **Public** - No authentication required
    - **User** - Requires any authenticated user
    - **Admin** - Requires admin privileges
    - **Elevated Admin** - Admin via Basic auth or an elevated client token (`POST /client/{id}/elevate`); admin user-management endpoints reject non-elevated sessions with 403
    - **Client Token** - Requires client token or basic auth
    - **App Token** - Requires application token

    ## Compatibility Baseline

    Behavior follows the Gotify server v3.1.1 behavior contract on the unchanged
    REST API 2.1.0 routes: `paging.next` is a relative path; terminal and empty
    pages return `paging.since: 0` (the last-page cursor is only set when
    another page exists); newly issued `gtfy…` application/client private-form
    tokens are returned only once (create/rotate responses). Legacy application
    plaintext credentials remain readable through the owner-scoped Woe detail
    endpoint. Application list reads omit the `token`
    key entirely and the Woe extension `GET /application/{id}` returns the
    stored token value verbatim with `Cache-Control: private, no-store`;
    client read responses keep `token: ""`;
    User/Application/Client/Plugin models serialize `createdAt`;
    clients support `expiresAfterInactivitySeconds`/`expiresAt` inactivity expiry;
    newly issued app/client tokens use the `gtfy…` EdDSA format (legacy `A…`/`C…`
    tokens remain valid); `POST /message` binds JSON, urlencoded, multipart and
    query-only requests per Gotify/Gin dispatch rules (the extras JSON-string
    binding in non-JSON encodings is a Woe extension); `POST /user` defaults an
    omitted or `null` `admin` to false; `PUT /application/{id}/security` treats
    a missing/false/`null` `regenerateToken` as a validated no-op returning
    `{}`. Media fields in responses (`image`/`avatar`/`icon`) use paths
    relative to the service base URL (`image/...`, no leading slash;
    applications without an image report `static/defaultapp.png`, served as a
    real PNG at `GET /static/defaultapp.png` at both the root and `/api/v1`
    entries); stored legacy values and R2 keys are unchanged and external
    full URLs / data URLs pass through verbatim. `POST /auth/logout` is the
    token-path subset of the upstream endpoint (token revocation only, no
    cookie session; see the operation description for boundaries). Woe extensions and retained deviations (including parsed safe integer
    priority precision and strict text binding) are documented in this description;
    implemented routes are not a claim of full behavioral compatibility.

  version: 1.3.7
  contact:
    name: Woe API Support
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1
  - url: /
    description: Root path (legacy compatibility)

tags:
  - name: system
    description: System health and status endpoints
  - name: init
    description: System initialization
  - name: auth
    description: Client token logout/revocation
  - name: user
    description: User management
  - name: current
    description: Current user operations
  - name: application
    description: Application management
  - name: client
    description: Client token management
  - name: message
    description: Message operations
  - name: plugin
    description: Plugin management
  - name: stream
    description: WebSocket streaming
  - name: image
    description: Image resource access

security:
  - BasicAuth: []
  - ClientToken: []
  - AppToken: []

paths:
  /health:
    get:
      tags:
        - system
      summary: Health check
      description: Check system and database health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /version:
    get:
      tags:
        - system
      summary: Get version information
      description: >-
        Returns version, commit, and build date generated at build/deploy time.
        Reports Woe's own version, not the upstream Gotify version (retained
        deviation).
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  /status:
    get:
      tags:
        - system
      summary: Get system status
      description: Returns initialization status, version, and health
      operationId: getStatus
      security: []
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /init/status:
    get:
      tags:
        - init
      summary: Get initialization status
      description: Check if system is initialized
      operationId: getInitStatus
      security: []
      responses:
        '200':
          description: Initialization status
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized:
                    type: boolean

  /init/admin:
    post:
      tags:
        - init
      summary: Create admin user
      description: Initialize system by creating the first admin user (requires default credentials)
      operationId: createAdminUser
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - pass
              properties:
                name:
                  type: string
                  description: Admin username
                pass:
                  type: string
                  description: Admin password
      responses:
        '200':
          description: Admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags:
        - auth
      summary: Revoke the authenticated client token (logout)
      description: >-
        Token-path logout following Gotify v3.1.1 RequireClient semantics:
        revokes the client credential that authenticated this request. A valid
        client token works without elevation. The target is locked to the
        authentication result (`userId` + `clientId` + the token snapshot
        taken at authentication time): the request body and query parameters
        cannot select a different client, and an internal snapshot guard
        prevents a stale logout from deleting a re-logged-in rotated
        credential for the same client id. A missing, invalid, or expired
        client token (or an application token) is rejected with 401 (Gotify
        error text). Token-path subset only: no Cookie is read and no
        Set-Cookie is ever returned (not a full cookie-session
        implementation).
      operationId: logout
      security:
        - ClientToken: []
      responses:
        '200':
          description: >-
            Logout acknowledged (empty JSON object): the old client credential
            can no longer authenticate.

            Idempotent: also returned when the credential was already deleted
            or rotated between authentication and execution (the new credential
            stays valid, no stream is disconnected); retrying the revoked token
            afterwards fails at the authentication layer with 401.

            Revocation is a single atomic database batch: it deletes the client
            row and cancels its pending/processing push deliveries (`status`
            set to `dead`, last error `Client logged out`); pushes already
            handed to the push vendor are not recalled.

            The client's WebSocket/stream connection is disconnected
            best-effort after commit: if the stream service is unavailable the
            response is still 200, and already-established connections are not
            guaranteed to be closed.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Basic authentication is recognized but carries no client credential
            to revoke (errorDescription is exactly `no client auth provided`);
            the database is not modified and no stream is disconnected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Database failure: the revocation batch was rolled back atomically
            and nothing was revoked (errorDescription `Failed to logout`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /current/user:
    get:
      tags:
        - current
      summary: Get current user
      description: Get information about the authenticated user
      operationId: getCurrentUser
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /current/user/password:
    post:
      tags:
        - current
      summary: Update current user password
      description: Change password for the authenticated user
      operationId: updateCurrentUserPassword
      security:
        - ClientToken: []
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pass
              properties:
                pass:
                  type: string
                  description: New password
      responses:
        '200':
          description: Password updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user:
    get:
      tags:
        - user
      summary: Get all users
      description: >-
        List all users. Requires an elevated admin session (Gotify v3.1.1
        RequireAdmin): Basic auth of an admin, or an admin client token with an
        unexpired elevation (`POST /client/{id}/elevate`). Unauthenticated or
        invalid credentials → 401; authenticated non-admin → 403; non-elevated
        admin → 403 with `session not elevated, use basic auth or call /client:elevate`.
      operationId: getAllUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - user
      summary: Create user
      description: >-
        Create a new user using Gotify baseline `{name, pass, admin}`.
        Follows Gotify v3.1.1 OptionalAdmin semantics: unauthenticated ordinary
        registration is allowed only when `REGISTRATION=true`, and only for
        non-admin users (anonymous `admin: true` → 401
        `you are not allowed to create an admin user`, never silently clamped);
        when `REGISTRATION=false`, anonymous creation → 401
        `you are not allowed to access this api`. Any authenticated request
        must be an elevated admin (non-admin → 403 regardless of registration
        switch; non-elevated admin → 403 session-not-elevated message).
        `app token` is not accepted. `admin` follows the Gotify zero-value
        binding: omitted or `null` defaults to `false` (the same normalized
        boolean drives both authorization and persistence); any other JSON
        type (string/number/array/object) → 400 `admin must be a boolean`.
        Woe extension: `nickname`, `email`, and `description` are optional.
      operationId: createUser
      security:
        - {}
        - ClientToken: []
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - pass
              properties:
                name:
                  type: string
                pass:
                  type: string
                admin:
                  type: boolean
                  nullable: true
                  default: false
                  description: >-
                    Optional (Gotify no-required-binding bool). Omitted or
                    `null` → `false`; explicit `true`/`false` honored; any
                    other JSON type → 400 `admin must be a boolean`.
                nickname:
                  type: string
                  description: Optional Woe extension field. Defaults to `name` when omitted.
                email:
                  type: string
                  description: Optional Woe extension field. Defaults to `needupdate@example.com` when omitted.
                description:
                  type: string
                  description: Optional user profile description.
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user/{id}:
    get:
      tags:
        - user
      summary: Get user by ID
      description: >-
        Get user details. An admin viewing another user requires an elevated
        admin session (Gotify v3.1.1 RequireAdmin). Woe extension (retained
        deviation): viewing your own user (`/user/{id}` where id is the
        authenticated user) stays accessible with a plain client token, no
        elevation required.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - user
      summary: Update user
      description: >-
        Update user details. Requires an elevated admin session (Gotify v3.1.1
        RequireAdmin): Basic auth of an admin, or an admin client token with an
        unexpired elevation.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                pass:
                  type: string
                admin:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - user
      summary: Update user (alternative)
      description: >-
        Update user details (alternative endpoint). Same semantics as
        `PUT /user/{id}`: requires an elevated admin session.
      operationId: updateUserPost
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                pass:
                  type: string
                admin:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - user
      summary: Delete user
      description: >-
        Delete a user. Requires an elevated admin session (Gotify v3.1.1
        RequireAdmin).
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user/{id}/applications:
    get:
      tags:
        - user
      summary: Get user applications
      description: >-
        Get all applications owned by a user (admin only). Each list item
        omits the `token` key entirely (same read contract as `GET
        /application`; see Application schema).
      operationId: getUserApplications
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user/{id}/clients:
    get:
      tags:
        - user
      summary: Get user clients
      description: Get all clients owned by a user (admin only). Read responses return an empty `token` string (show-once semantics; see Client schema).
      operationId: getUserClients
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user/{id}/plugins:
    get:
      tags:
        - user
      summary: Get user plugins
      description: Get all plugins accessible by a user (admin only)
      operationId: getUserPlugins
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginConf'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user/{id}/profile:
    put:
      tags:
        - user
      summary: Update user profile
      description: Update user profile (nickname, email, description)
      operationId: updateUserProfile
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                email:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/{id}/avatar:
    post:
      tags:
        - user
      summary: Upload user avatar
      description: Upload avatar image for user
      operationId: uploadUserAvatar
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - user
      summary: Delete user avatar
      description: Remove user avatar image
      operationId: deleteUserAvatar
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Avatar deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/{id}/plugin-permissions:
    get:
      tags:
        - user
      summary: Get user plugin permissions
      description: Get plugin permissions for a user (admin only)
      operationId: getUserPluginPermissions
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Plugin permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - user
      summary: Update user plugin permissions
      description: Update plugin permissions for a user (admin only)
      operationId: updateUserPluginPermissions
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modulePaths
              properties:
                modulePaths:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /application:
    get:
      tags:
        - application
      summary: Get all applications
      description: >-
        List all applications for the authenticated user. Each list item omits
        the `token` key entirely (Gotify v3 `omitempty` semantics — the key is
        absent, not an empty string), so list responses carry no credential
        material. Newly issued `gtfy…` private-form tokens are returned only
        in the `POST /application` create response and the
        `PUT /application/{id}/security` rotate response. Legacy application
        plaintext credentials remain readable through the owner-scoped
        `GET /application/{id}` detail endpoint.
      operationId: getAllApplications
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - application
      summary: Create application
      description: Create a new application
      operationId: createApplication
      security:
        - ClientToken: []
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                defaultPriority:
                  type: integer
                sortKey:
                  type: string
                  description: Optional stable sort key. When omitted, server generates one.
      responses:
        '200':
          description: >-
            Application created successfully. The response carries the new
            token exactly once: a `gtfy…` EdDSA private-form token
            (`gtfya.<base64url(seed)>`; the database stores the public form).
            Legacy `A…` tokens are no longer issued but remain valid for
            authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /application/{id}:
    get:
      tags:
        - application
      summary: Get application by ID
      description: >-
        Get application details (Woe extension; upstream Gotify has no
        single-get endpoint). Strictly owner-scoped: the row is selected by
        both id and the authenticated user id, with no admin bypass — unknown
        or non-owned ids return 404 with no token material. The response
        returns the stored token value verbatim: a `gtfy…` public-form lookup
        value for enhanced-format applications (a public key, not a usable
        credential; intended for local derivation-based validation) or the
        legacy plaintext token for legacy rows. The success response is sent
        with `Cache-Control: private, no-store` and must not be cached.
      operationId: getApplication
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application details with the stored token value verbatim
          headers:
            Cache-Control:
              description: >-
                `private, no-store` — the detail response carries token
                material (stored value) and must not be cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Application not found or not owned by the caller. The error
            response contains no token material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - application
      summary: Update application
      description: Update application details
      operationId: updateApplication
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                defaultPriority:
                  type: integer
                sortKey:
                  type: string
                  description: Optional stable sort key.
      responses:
        '200':
          description: >-
            Application updated successfully. Per upstream Gotify v3, the
            response keeps the stored token value (for gtfy-issued applications
            this is the public lookup form, not a usable two-segment
            credential).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - application
      summary: Delete application
      description: Delete an application
      operationId: deleteApplication
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /application/{id}/image:
    post:
      tags:
        - application
      summary: Upload application image
      description: >-
        Upload or replace the application image. Woe extensions beyond the
        multipart `file` field: a raw `image/*` request body is also accepted.
        The 200 response is the Application read model whose `image` field
        carries the normalized relative path `image/<key>` (no leading slash,
        relative to the service base URL) and whose `token` keeps the stored
        token value (per upstream v3 write semantics). The stored database
        value keeps the legacy format (`/api/v1/image/<key>`) and existing R2
        keys are unchanged; replacing an image does not delete the previous R2
        object (deletion only happens on the DELETE endpoint).
      operationId: uploadApplicationImage
