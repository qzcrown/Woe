      summary: Delete application image
      description: >-
        Delete the application image. On success the R2 object is deleted, the
        database `image` is set to NULL, and the response is the updated
        complete Application read model (Gotify semantics): `token` still
        returns `token: ""` (unchanged Woe read model for image deletion; the
        field is not a validation source) and an application without an image
        reports `image: "static/defaultapp.png"` (response-only; never stored).
        Deleting again when no image exists → 404 `No image to delete`.
      operationId: deleteApplicationImage
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
