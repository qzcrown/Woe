  /application/{id}/security:
    put:
      tags:
        - application
      summary: Application security update action (rotate token or validated no-op)
      description: >-
        Gotify `SecurityUpdateAction` dispatch. `regenerateToken` action
        values: `true` rotates the application token (existing flow);
        `false`, omitted, or `null` is a validated no-op — elevation,
        existence, and strict owner checks still run, then the response is the
        byte-exact empty object `{}` (no rotation, no token returned; the
        route does not short-circuit before the resource checks). Any other
        JSON type for `regenerateToken` → 400 `regenerateToken must be true`;
        a non-object top-level body (array/scalar) → 400 `Invalid JSON body`.
        Dangerous endpoint: requires an elevated session (Basic auth, or a
        client token with an unexpired elevation from
        `POST /client/{id}/elevate`); strict owner check (non-owner → 404),
        no admin bypass.
      operationId: updateApplicationSecurity
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                regenerateToken:
                  type: boolean
                  nullable: true
                  description: >-
                    `true` rotates; `false`/omitted/`null` is a validated
                    no-op returning `{}`; any other JSON type → 400.
      responses:
        '200':
          description: >-
            Action executed. For `regenerateToken: true` the response
            `{"regenerateToken": {"token": …}}` carries the new token exactly
            once: a `gtfy…` EdDSA private-form token
            (`gtfya.<base64url(seed)>`; the database stores the public form).
            Legacy `A…` tokens are no longer issued but remain valid for
            authentication. For `false`/omitted/`null` the response is the
            byte-exact empty object `{}` (no `regenerateToken` key, no token).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    description: No-op response (byte-exact `{}`).
                  - type: object
                    properties:
                      regenerateToken:
                        type: object
                        properties:
                          token:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

