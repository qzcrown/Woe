  /message:
    get:
      tags:
        - message
      summary: Get all messages
      description: >-
        Get all messages for the authenticated user. `paging.next` is a
        relative path (Gotify v3), e.g. `/message?limit=100&since=23`; present
        only when another page exists.
      operationId: getAllMessages
      security:
        - ClientToken: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Paged messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessages'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - message
      summary: Create message
      description: >-
        Send a new message. Gotify RequireApplicationOrClient semantics: application
        token targets the token's own application (body appid is ignored); client token
        and Basic auth must carry the owning application's appid. Request binding
        follows Gotify/Gin dispatch rules: `application/json` binds only the body
        (query message fields are never merged in);
        `application/x-www-form-urlencoded` binds body first-values with query
        filling only fields missing from the body; `multipart/form-data` binds
        text fields only (a File part whose name collides with a message field →
        400 `message must be a text field, not a file`; a missing boundary →
        400; no attachment-upload capability is added); a missing or unknown
        Content-Type takes the form default path, which reads only the query.
        Duplicate fields take the first value; an explicitly empty body value is
        a legal binding value and does not fall back to query. Token
        authentication is resolved independently (a query `token` parameter
        authenticates but is not a message field). Woe extension: in
        urlencoded/multipart/query encodings, `extras` is bound from a
        JSON-encoded string (upstream Gotify marks extras `form:"-"` and does
        not bind it); invalid JSON → 400. Explicit priority is checked as a safe integer after parsing
        in every encoding. JSON numeric literals may round before this check;
        inherited application defaults are not revalidated. Woe extension: while
        the deployment maintenance gate (system_state enqueue_write_gate) is paused,
        this endpoint returns 503 and no outbox row is enqueued.
      operationId: createMessage
      security:
        - AppToken: []
        - ClientToken: []
        - BasicAuth: []
      requestBody:
        required: false
        description: >-
          Not required: query-only requests (no body, missing or unknown
          Content-Type) bind their message fields from the query parameters
          (`message`, `title`, `priority`, `appid`, `extras`).
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The message content
                title:
                  type: string
                  description: Message title
                priority:
                  type: integer
                  description: >-
                    Explicit priority must be a safe integer after JSON parsing.
                    JSON numeric literals may round before validation. Omitted or
                    null priority inherits the application's defaultPriority;
                    that inherited value is not revalidated by this check.
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                  nullable: true
                extras:
                  type: object
                  description: Additional data
                appid:
                  type: integer
                  description: >-
                    Owning application id. Required (and only meaningful) when
                    authenticating with a client token or Basic auth; ignored when an
                    application token is used (the token's own application is the target).
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The message content
                title:
                  type: string
                  description: Message title
                priority:
                  type: integer
                  description: >-
                    Explicit priority as a decimal integer string; the converted
                    number must be a safe integer. Invalid
                    integers are rejected with 400. An empty string
                    (`priority=`) is an explicit 0; omitting the field falls
                    back to the application's defaultPriority.
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                appid:
                  type: integer
                  description: >-
                    Owning application id as a decimal integer string; invalid
                    integers are rejected with 400. Required with client token /
                    Basic auth.
                extras:
                  type: string
                  description: >-
                    Woe extension: additional data as a JSON-encoded string;
                    invalid JSON is rejected with 400. (Upstream Gotify marks
                    extras `form:"-"` and does not bind it for form requests.)
            encoding:
              priority:
                style: form
              appid:
                style: form
          multipart/form-data:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: >-
                    The message content (text field; a File part with this
                    name is rejected with 400).
                title:
                  type: string
                  description: Message title (text field)
                priority:
                  type: integer
                  description: >-
                    Explicit priority as a decimal integer text field; the converted
                    number must be a safe integer;
                    same strict-integer rules as urlencoded (`priority=` empty
                    text is an explicit 0).
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                appid:
                  type: integer
                  description: >-
                    Owning application id as a decimal integer text field.
                extras:
                  type: string
                  description: >-
                    Woe extension: additional data as a JSON-encoded text
                    field; invalid JSON is rejected with 400.
      responses:
        '200':
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags:
        - message
      summary: Delete all messages
      description: Delete all messages for the authenticated user
      operationId: deleteAllMessages
      security:
        - ClientToken: []
        - BasicAuth: []
      responses:
        '200':
          description: All messages deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

